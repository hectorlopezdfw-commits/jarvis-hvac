services:
  - type: web
    name: jarvis-hvac
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Jarvis HVAC
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BUSINESS_NAME
        value: Your HVAC Company
      - key: APP_URL
        value: https://jarvis-hvac.onrender.com
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_FROM_NUMBER
        value: ""
      - key: DEFAULT_REVIEW_LINK
        value: https://www.google.com/maps
      # Optional external database. Leave blank to use the SQLite fallback.
      # sync: false so a Postgres URL entered in the Render dashboard is not wiped by blueprint deploys.
      - key: DATABASE_URL
        sync: false
      # Set this in the Render dashboard. The value is not stored in git.
      # Until it is set, dashboard and lead-reading routes stay locked.
      - key: DASHBOARD_PASSWORD
        sync: false
